# netlify.toml (OFFICIAL site)

# Normalize
[[redirects]]
  from = "/officiel"
  to = "/officiel/"
  status = 301

# Serve Vite-built assets as-is
[[redirects]]
  from = "/officiel/assets/*"
  to = "/officiel/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/officiel/photos/*"
  to = "/officiel/photos/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/officiel/img/*"
  to = "/officiel/img/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/officiel/src/*"
  to = "/officiel/src/:splat"
  status = 200
  force = true

# Serve any file that has an extension as-is (JS, CSS, images, PDFs, etc.)
[[redirects]]
  from = "/officiel/*.*"
  to = "/officiel/:splat"
  status = 200
  force = true

# SPA fallback for everything else under /officiel/*
[[redirects]]
  from = "/officiel/*"
  to = "/officiel/index.html"
  status = 200
  force = true
