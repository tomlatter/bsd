# netlify.toml (OFFICIAL site)

# 1) Normalize /officiel -> /officiel/
[[redirects]]
  from = "/officiel"
  to = "/officiel/"
  status = 301

# 2) Serve built assets AS-IS (avoid rewriting them to HTML)
#    Vite puts all hashed JS/CSS/etc under /officiel/assets/*
[[redirects]]
  from = "/officiel/assets/*"
  to = "/officiel/assets/:splat"
  status = 200
  force = true

# 3) SPA fallback for every other /officiel/* route
[[redirects]]
  from = "/officiel/*"
  to = "/officiel/index.html"
  status = 200
  force = true
